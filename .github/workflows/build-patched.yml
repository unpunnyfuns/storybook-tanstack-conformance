name: Build patched

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when neither source has moved"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.compare.outputs.rebuild }}
      framework_sha: ${{ steps.compare.outputs.framework_sha }}
      source_sha: ${{ steps.compare.outputs.source_sha }}
    steps:
      - name: Compare source SHAs with the current build
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          framework_sha=$(gh api "repos/storybookjs/storybook/commits?sha=next&path=code/frameworks/tanstack-react&per_page=1" --jq '.[0].sha')
          source_sha=$(git ls-remote https://github.com/unpunnyfuns/storybook.git refs/heads/conformance-build | cut -c1-12)
          current=$(gh release view conformance-build --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
          echo "framework_sha=$framework_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          # Without this, a tarball that is wrong for a reason other than its
          # inputs (a broken build recipe, say) cannot be replaced except by
          # pushing a throwaway commit to move a SHA.
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced rebuild requested."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          elif echo "$current" | grep -q "$framework_sha" && echo "$current" | grep -q "$source_sha"; then
            echo "No source movement; keeping the current build."
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "Source moved; rebuilding."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

  # The tarball is built from conformance-build alone, so a fix branch that
  # gains commits after being merged is missing from the release and nothing
  # else says so. Two docs fixes and a pathless-layout fix went unnoticed that
  # way. Ancestry cannot answer the question: several branches were squashed
  # after being composed, and later phases rewrote the same code, so their tips
  # are not ancestors although their content is present. The manifest records
  # the tip that was composed, and this job reports the ones that moved.
  #
  # It carries no `needs` on purpose. A branch moving changes neither SHA the
  # check job compares, so a guard inside the build would stay silent for
  # exactly the drift it exists to catch.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: unpunnyfuns/storybook
          ref: conformance-build

      - name: Compare every composed branch with the tip recorded for it
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const { execSync } = require("node:child_process");
            const { branches } = JSON.parse(readFileSync("conformance-branches.json", "utf8"));
            const moved = [];
            for (const entry of branches) {
              const ref = execSync("git ls-remote origin refs/heads/" + entry.branch).toString();
              moved.push({ ...entry, live: ref.split(/\s/)[0] || "" });
            }
            const drift = moved.filter((e) => e.live !== e.sha);
            for (const e of drift) {
              const state = e.live ? "now " + e.live.slice(0, 12) : "deleted from the fork";
              console.log("::error::" + e.branch + " moved since it was composed (recorded " +
                e.sha.slice(0, 12) + ", " + state + "). Merge it into conformance-build and " +
                "update its sha in conformance-branches.json, in that one commit.");
            }
            console.log(`${moved.length - drift.length}/${moved.length} composed branches unchanged.`);
            process.exit(drift.length ? 1 : 0);
          '

  build:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The composed branch carries the pending fixes with their conflict
      # resolutions already recorded, so merging the upstream tip into it
      # only conflicts when upstream genuinely touches the same code. A
      # failed merge is the signal that the pending PRs need a rebase; the
      # release keeps serving the last good build until then.
      - uses: actions/checkout@v5
        with:
          repository: unpunnyfuns/storybook
          ref: conformance-build
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Merge the upstream tip
        run: |
          git config user.name conformance-bot
          git config user.email actions@users.noreply.github.com
          git remote add upstream https://github.com/storybookjs/storybook.git
          git fetch --no-tags upstream next
          git merge --no-edit upstream/next

      # The `production` configuration is what passes `--prod` to
      # scripts/build/build-package.ts, and that script only emits `.d.ts`
      # files when it sees it. Without it the tarball installs untyped, every
      # story in every app degrades to `any`, and `tsc` reports TS7016 for the
      # framework itself. Nothing in CI typechecks a channel, so this went
      # unnoticed until a local `npm run check` ran against `patched`.
      - name: Build the framework
        env:
          NX_NO_CLOUD: "true"
        run: |
          corepack enable
          cd code
          yarn install
          npx nx run tanstack-react:compile:production
          test -f frameworks/tanstack-react/dist/index.d.ts \
            || { echo "::error::build produced no type declarations"; exit 1; }

      - name: Pack the tarball
        id: pack
        run: |
          cd code/frameworks/tanstack-react
          base=$(node -p "require('./package.json').version")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          npm pkg set version="$base-fixes.${{ github.run_number }}" \
            "dependencies.@storybook/builder-vite=^$base" \
            "dependencies.@storybook/react=^$base" \
            "dependencies.@storybook/react-vite=^$base" \
            "peerDependencies.storybook=^$base"
          mkdir -p /tmp/out
          npm pack --pack-destination /tmp/out
          mv /tmp/out/*.tgz /tmp/out/storybook-tanstack-react-patched.tgz

      - name: Publish and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tarball is upstream next plus the still-open fixes; the list
          # lives in fixes.json on the conformance repo, not in this file.
          open_prs=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/fixes.json" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).fixes.filter(f=>f.status==='open').map(f=>'#'+f.pr).join(' ')))")
          gh release upload conformance-build /tmp/out/storybook-tanstack-react-patched.tgz --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit conformance-build --repo "$GITHUB_REPOSITORY" \
            --notes "base: ${{ steps.pack.outputs.base }} @ ${{ needs.check.outputs.framework_sha }} | source: ${{ needs.check.outputs.source_sha }} (https://github.com/unpunnyfuns/storybook/tree/conformance-build) | PRs: $open_prs"
          gh workflow run conformance.yml --repo "$GITHUB_REPOSITORY"
